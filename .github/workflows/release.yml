name: Release

# Manual only. A run without `publish` checks, builds and tests the release,
# installs it into the runner's Maven local repository and keeps those files,
# but publishes nothing. With `publish`, a second job signs and uploads it to
# Maven Central. gradle.properties keeps publishGuard=locked until launch, and
# every remote publish task fails while it does, so even a mistaken `publish`
# run uploads nothing (see CONTRIBUTING.md).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Maven Central (fails while publishGuard is locked)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      # The contract suite runs Prism through npx.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Format, compile, unit and doc tests, examples, javadoc
        run: ./gradlew spotlessCheck build --no-daemon
      - name: Contract tests
        run: ./gradlew contractTest --no-daemon
      - name: Install into the Maven local repository
        run: ./gradlew publishToMavenLocal --no-daemon
      - name: List the published files
        run: find ~/.m2/repository/com/teachmehipaa -type f | sort
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-local
          path: ~/.m2/repository/com/teachmehipaa/
          if-no-files-found: error

  publish:
    name: Publish to Maven Central
    needs: verify
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/com.teachmehipaa/teachmehipaa-java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      # checkPublishGuard runs first and fails unless publishGuard=unlocked. No
      # configuration cache, so the signing key is never written into one.
      - name: Sign and upload to the Central Portal staging API
        run: ./gradlew publishMavenPublicationToCentralPortalRepository --no-daemon --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_centralPortalUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          ORG_GRADLE_PROJECT_centralPortalPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      # The staging API holds the upload until it is handed to the Portal.
      # user_managed leaves it there for a last manual "Publish".
      - name: Hand the deployment to the Central Portal
        run: |
          token=$(printf '%s:%s' "$CENTRAL_PORTAL_USERNAME" "$CENTRAL_PORTAL_PASSWORD" | base64 -w0)
          curl --fail-with-body --request POST \
            --header "Authorization: Bearer $token" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/com.teachmehipaa?publishing_type=user_managed"
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
